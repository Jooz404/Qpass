server {
    listen 80;
    server_name qpass.my.id www.qpass.my.id;

    # Folder build frontend React Vite
    root /home/qpass_bitung/frontend/dist;
    index index.html;

    # Routing Single Page Application (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Request ke Backend Node.js (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket (Socket.io)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Folder Upload Gambar/File
    location /uploads/ {
        alias /home/qpass_bitung/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
